name: Deploy nginx to AWS with Terraform

on:
  push:
    branches:
      - main # run workflow whenever code pushed to main

permissions:
  contents: read

env: # from repo secrets
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_my_ip: ${{ secrets.TF_VAR_my_ip }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      # download repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v7

      # install Terraform CLI on runner
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # download AWS provider
      - name: Terraform init
        run: terraform init

      # preview changes
      - name: Terraform plan
        run: terraform plan

      # create resources -- auto-approve replaces typing "yes"
      - name: Terraform apply
        run: terraform apply -auto-approve
